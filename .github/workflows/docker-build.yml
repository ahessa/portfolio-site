name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          docker build -t ahessa/portfolio-site:${{ github.sha }} .

      - name: Push image
        run: |
          docker push ahessa/portfolio-site:${{ github.sha }}

      - name: Clone chart repository
        run: |
          git clone https://x-access-token:${{ secrets.CHART_REPO_TOKEN }}@github.com/ahessa/portfolio-chart.git

      - name: Update values.yaml
        run: |
          sed -i 's/tag: ".*"/tag: "${{ github.sha }}"/' portfolio-chart/values.yaml

      - name: Commit and push chart changes
        run: |
          cd portfolio-chart
          git config user.name "github-actions"
          git config user.email "${{ secrets.GIT_EMAIL }}"
          git add values.yaml
          git commit -m "Update image tag to ${{ github.sha }}" || echo "No changes"
          git push
